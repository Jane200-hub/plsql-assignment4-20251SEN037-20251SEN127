<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Pay day, PL/SQL style</title>
  <desc id="d">A payslip for Alice Uwimana showing basic salary 850000, allowances 50000, deductions 25000 and net salary 875000 RWF.</desc>
  <rect width="1200" height="320" fill="#001a20"/>
  <g stroke="#072930" stroke-width="2">
    <line x1="0" y1="64" x2="1200" y2="64"/>
    <line x1="0" y1="128" x2="1200" y2="128"/>
    <line x1="0" y1="192" x2="1200" y2="192"/>
  </g>
  <g font-family="ui-sans-serif, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="64" y="138" font-size="76" font-weight="800" fill="#eff7f8">Pay day,</text>
    <text x="64" y="218" font-size="76" font-weight="800" fill="#fac131">PL/SQL style.</text>
    <text x="64" y="262" font-size="21" fill="#a9c3ca">Records, collections, cursors and bulk processing,</text>
    <text x="64" y="288" font-size="21" fill="#a9c3ca">all in Oracle.</text>

    <g transform="rotate(-3 950 160)">
      <rect x="766" y="36" width="380" height="264" rx="10" fill="#000000" opacity="0.35"/>
      <rect x="760" y="28" width="380" height="264" rx="10" fill="#f6f5f1"/>
      <text x="784" y="62" font-size="13" font-weight="700" letter-spacing="2" fill="#4a6268">PAYSLIP</text>
      <text x="784" y="96" font-size="23" font-weight="700" fill="#0c2328">Alice Uwimana</text>
      <text x="784" y="118" font-size="14" fill="#4a6268">HR Manager, October 2026</text>
      <line x1="784" y1="136" x2="1116" y2="136" stroke="#0c2328" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="784" y="166" font-size="16" fill="#0c2328">Basic salary</text>
      <text x="1116" y="166" font-size="16" fill="#0c2328" text-anchor="end">850000</text>
      <text x="784" y="192" font-size="16" fill="#0c2328">Allowances</text>
      <text x="1116" y="192" font-size="16" fill="#0c2328" text-anchor="end">+50000</text>
      <text x="784" y="218" font-size="16" fill="#0c2328">Deductions</text>
      <text x="1116" y="218" font-size="16" fill="#0c2328" text-anchor="end">-25000</text>
      <rect x="772" y="238" width="356" height="38" rx="6" fill="#fac131"/>
      <text x="788" y="263" font-size="18" font-weight="800" fill="#0c2328">Net salary</text>
      <text x="1112" y="263" font-size="18" font-weight="800" fill="#0c2328" text-anchor="end">875000 RWF</text>
    </g>
  </g>
</svg>
